apiVersion: apps/v1
kind: Deployment
metadata:
  name: rklit-deploy-nginx
  namespace: website-nginx
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: rklit/rklit-image-nginx:1.0
          ports:
            - containerPort: 80
          command: ["nginx"]
          args: ["-g", "daemon off;"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: website-nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
