name: Docker Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build the Docker image
      run: |
        docker build -t rklit/rklit-image-nginx:latest .
        docker tag rklit/rklit-image-nginx:latest rklit/rklit-image-nginx:${{ github.sha }}

    - name: Push Docker image
      run: |
        docker push rklit/rklit-image-nginx:latest
        docker push rklit/rklit-image-nginx:${{ github.sha }}
      
